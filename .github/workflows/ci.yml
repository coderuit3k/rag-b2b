name: CI

# Chỉ check KHÔNG cần secret (compile Python, build/lint frontend) — không chạy eval/smoke_features.py
# hay eval/ragas_eval.py ở đây vì 2 script đó gọi LLM/DB THẬT (OpenAI, Anthropic, Neo4j, Qdrant,
# Tavily, Composio, Cloudflare, Clerk...) -> cần ~30 secrets, tốn phí mỗi lần push, và dễ fail giả vì
# dịch vụ ngoài chập chờn chứ không phải do code sai. Muốn chạy smoke suite trong CI thì thêm secrets
# tương ứng vào Settings -> Secrets rồi bỏ comment job "smoke" bên dưới.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile-check (bắt lỗi syntax, không chạy code)
        run: python -m compileall -q src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

